services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: med-appoint-c2-s07-local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medical_appointment
      POSTGRES_USER: medical_app
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_app -d medical_appointment"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - medical_appointment_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
volumes:
  medical_appointment_postgres_data:

