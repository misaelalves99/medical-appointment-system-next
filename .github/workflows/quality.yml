name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - task/medappoint-07-delivery

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_FACEBOOK_APP_ID: synthetic-facebook-app-id
      NEXT_PUBLIC_FIREBASE_API_KEY: synthetic-api-key-for-ci-build
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:synthetic
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: synthetic.invalid
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-SYNTHETIC
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: synthetic-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: synthetic-project.invalid
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: synthetic-google-client-id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lockfile diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "=== LOCKFILE DIAGNOSTIC START ==="
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          echo "os=$(uname -a)"
          tmp="$(mktemp -d)"
          cp package.json "$tmp/package.json"
          cp package-lock.json "$tmp/package-lock.before.json"
          cp package-lock.json "$tmp/package-lock.json"
          cd "$tmp"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "=== LOCKFILE DIFF START ==="
          diff -u package-lock.before.json package-lock.json || true
          echo "=== LOCKFILE DIFF END ==="
          echo "=== TARGET VERSIONS AFTER RECONCILIATION ==="
          node -e "const l=require('./package-lock.json'); const p=l.packages||{}; for (const k of Object.keys(p).filter(k => /node_modules\/(picomatch|csstype)$/.test(k) || /node_modules\/@types\/(react|prop-types)$/.test(k)).sort()) console.log(k+'='+p[k].version);"
          echo "=== LOCKFILE DIAGNOSTIC END ==="

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
